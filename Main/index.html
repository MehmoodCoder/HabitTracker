<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker, Dev Weekends</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .today-highlight {
            background-color: #fff3cd !important;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container my-5">
        <h1 class="text-center mb-4">Daily Habit Tracker</h1>

        <div class="row justify-content-center mb-4">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" id="Input" class="form-control" placeholder="E.g., Read 30 mins">
                    <button class="btn btn-primary" onclick="addHabit()">Add Habit</button>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <button class="btn btn-secondary btn-sm" onclick="previousWeek()">← Previous Week</button>
            <h5 id="weekLabel" class="m-0">Current Week</h5>
            <button class="btn btn-secondary btn-sm" onclick="nextWeek()">Next Week →</button>
        </div>


        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-bordered align-middle text-center m-0">
                    <thead class="table-dark">
                        <tr>
                            <th style="width: 25%; text-align: left;">Habit Name</th>
                            <th>Monday</th>
                            <th>Tuesday</th>
                            <th>Wednesday</th>
                            <th>Thursday</th>
                            <th>Friday</th>
                            <th>Saturday</th>
                            <th>Sunday</th>
                            <th style="width: 15%;">Streak </th>
                            <th style="width: 10%;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="habitTableBody">
                        </tbody>
                </table>
            </div>
            <div id="emptyState" class="text-center p-5 text-muted">
                <h5>No habits added yet!</h5>
                <p class="mb-0">Type a habit above and click 'Add Habit' to start tracking your routine.</p>
            </div>
        </div>
        
    </div>

    <script src="app.js"></script>
</body>
</html>
